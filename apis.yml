aid: genscript-probio
name: Genscript Probio
description: >-
  GenScript ProBio (ProBio) is the biologics and cell & gene therapy contract development and
  manufacturing organization (CDMO) segment of GenScript Biotech Corporation (HKEX 1548), operating
  from sites in the United States, the Netherlands, South Korea, Hong Kong, Shanghai, Nanjing and
  Zhenjiang. It provides end-to-end drug-discovery-to-commercialization services covering antibody
  and ADC discovery, antibody engineering and humanization, developability assessment, cell line
  development, bioanalytical and bioassay services, process development, and cGMP clinical and
  commercial manufacturing of recombinant proteins, plasmid DNA, lentiviral and AAV viral vectors,
  mRNA and cell therapies, having supported more than 150 IND approvals since 2017. ProBio is a
  laboratory and manufacturing services business rather than a software vendor: it publishes no
  developer portal, no API reference and no machine-readable contract, and customer engagement runs
  through a quote request form and an authenticated customer account area.
